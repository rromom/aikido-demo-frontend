name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# VULN: excessive-workflow-permissions — "write-all" grants this workflow
# write access to every GitHub API scope (contents, packages, issues,
# deployments, etc.) instead of the single "pages: write" scope it actually
# needs. A compromised action/dependency in this run inherits all of it.
permissions: write-all

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      # VULN: hardcoded-secret-in-workflow — a personal access token is pasted
      # here in plaintext instead of using `${{ secrets.GH_PAGES_TOKEN }}`.
      # Anyone with read access to this repo (or its Actions logs) gets a
      # third-party token with far more privilege than "push to gh-pages".
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: "ghp_DEMOFAKEPAT1234567890abcdefGHIJKL"
          publish_dir: ./dist
